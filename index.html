<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#07070d">
  <meta name="color-scheme" content="dark">
  <title>PAVEL SISTEM DIGITAL</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Unbounded:wght@600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #07070d;
      --card-bg: #120f22;
      --card-border: rgba(168, 85, 247, 0.28);
      --purple: #a855f7;
      --cyan: #22d3ee;
      --pink: #f43f5e;
      --emerald: #10b981;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --btn-grad: linear-gradient(135deg, #06b6d4 0%, #3b82f6 50%, #a855f7 100%);
      --radius: 22px;
      /* Мягкие объёмные тени с деликатным неоновым свечением */
      --soft-shadow: 0 10px 26px -6px rgba(0, 0, 0, 0.65), 0 0 16px -2px rgba(168, 85, 247, 0.16);
      --card-shadow: 0 14px 34px -8px rgba(0, 0, 0, 0.75), 0 0 22px -3px rgba(34, 211, 238, 0.15), 0 0 14px -4px rgba(168, 85, 247, 0.18);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      min-height: 100dvh;
      overflow-x: hidden;
      display: flex;
      justify-content: center;
      position: relative;
    }

    /* Фоновые неоновые сферы */
    .ambient-bg {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      overflow: hidden;
    }
    .blob-1 {
      position: absolute;
      top: -10vw;
      left: 50%;
      transform: translateX(-50%);
      width: 90vw;
      max-width: 550px;
      height: 90vw;
      max-height: 550px;
      background: radial-gradient(circle, rgba(168, 85, 247, 0.22) 0%, rgba(6, 182, 212, 0.08) 50%, transparent 70%);
      border-radius: 50%;
    }
    .blob-2 {
      position: absolute;
      bottom: -10vh;
      right: -10vw;
      width: 80vw;
      max-width: 450px;
      height: 80vw;
      max-height: 450px;
      background: radial-gradient(circle, rgba(236, 72, 153, 0.16) 0%, rgba(59, 130, 246, 0.08) 60%, transparent 75%);
      border-radius: 50%;
    }

    /* Основной контейнер под мобильный формат */
    .container {
      width: 100%;
      max-width: 100%;
      padding: max(18px, env(safe-area-inset-top)) 16px max(36px, env(safe-area-inset-bottom));
      position: relative;
      z-index: 1;
      overflow-x: hidden;
    }

    /* Контейнер слайдера экранов */
    .slider-stage {
      position: relative;
      width: 100%;
    }

    /* Анимации горизонтального слайдера */
    .view-screen {
      width: 100%;
    }

    .slide-next-enter {
      animation: slideInFromRight 0.36s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }
    .slide-prev-enter {
      animation: slideInFromLeft 0.36s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }
    .slide-next-leave {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      pointer-events: none;
      animation: slideOutToLeft 0.36s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }
    .slide-prev-leave {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      pointer-events: none;
      animation: slideOutToRight 0.36s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    @keyframes slideInFromRight {
      from { opacity: 0; transform: translate3d(100%, 0, 0); }
      to { opacity: 1; transform: translate3d(0, 0, 0); }
    }
    @keyframes slideOutToLeft {
      from { opacity: 1; transform: translate3d(0, 0, 0) scale(1); }
      to { opacity: 0; transform: translate3d(-35%, 0, 0) scale(0.96); }
    }
    @keyframes slideInFromLeft {
      from { opacity: 0; transform: translate3d(-35%, 0, 0) scale(0.96); }
      to { opacity: 1; transform: translate3d(0, 0, 0) scale(1); }
    }
    @keyframes slideOutToRight {
      from { opacity: 1; transform: translate3d(0, 0, 0); }
      to { opacity: 0; transform: translate3d(100%, 0, 0); }
    }

    /* Шапка сайта */
    .header {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      margin-bottom: 22px;
      padding-top: 4px;
    }

    /* Блок логотипа */
    .brand-logo-wrap {
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      margin-bottom: 10px;
      min-height: 76px;
    }
    .brand-logo-img {
      max-width: 290px;
      max-height: 110px;
      width: auto;
      height: auto;
      object-fit: contain;
      filter: drop-shadow(0 8px 22px rgba(168, 85, 247, 0.38));
    }

    /* Запасной логотип, если картинка еще не добавлена */
    .brand-logo-fallback {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }
    .brand-logo-fallback .ps-mark {
      font-family: 'Unbounded', sans-serif;
      font-size: 38px;
      font-weight: 800;
      background: linear-gradient(135deg, #a855f7 0%, #ec4899 50%, #38bdf8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 0 16px rgba(168, 85, 247, 0.5));
      letter-spacing: -1px;
    }
    .brand-logo-fallback .ps-title {
      font-family: 'Unbounded', sans-serif;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 3px;
      color: #fff;
      text-shadow: 0 0 12px rgba(255,255,255,0.4);
    }
    .brand-logo-fallback .ps-sub {
      font-size: 10px;
      letter-spacing: 5px;
      color: #94a3b8;
      text-transform: uppercase;
    }

    .brand-desc {
      color: var(--text-muted);
      font-size: 14px;
      line-height: 1.45;
      max-width: 320px;
    }

    /* Карточки продуктов с тонкими неоновыми контурами и мягким свечением */
    .product-card {
      position: relative;
      display: block;
      border: 1.5px solid transparent;
      background: 
        linear-gradient(180deg, rgba(20, 16, 38, 0.92), rgba(14, 12, 26, 0.96)) padding-box,
        linear-gradient(135deg, rgba(168, 85, 247, 0.55) 0%, rgba(236, 72, 153, 0.35) 50%, rgba(34, 211, 238, 0.6) 100%) border-box;
      border-radius: var(--radius);
      overflow: hidden;
      text-decoration: none;
      color: inherit;
      margin-bottom: 18px;
      box-shadow: var(--card-shadow);
      transition: transform 0.22s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.22s;
    }
    .product-card:hover {
      box-shadow: 0 16px 38px -6px rgba(0, 0, 0, 0.8), 0 0 26px rgba(34, 211, 238, 0.25), 0 0 18px rgba(168, 85, 247, 0.25);
    }
    .product-card:active {
      transform: scale(0.975);
    }

    .card-banner {
      width: 100%;
      height: 172px;
      position: relative;
      background-size: cover;
      background-position: center;
      background-color: #120e24;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      padding: 12px;
    }
    .card-banner::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(7,7,13,0.15) 0%, rgba(7,7,13,0.45) 55%, rgba(15,12,29,0.98) 100%);
    }

    /* Декоративная тематическая иконка на баннере */
    .banner-visual-badge {
      position: relative;
      z-index: 2;
      width: 40px;
      height: 40px;
      border-radius: 12px;
      background: rgba(15, 13, 28, 0.92);
      border: 1px solid rgba(168, 85, 247, 0.45);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.5), 0 0 12px rgba(168, 85, 247, 0.3);
    }

    .card-badges {
      position: relative;
      z-index: 2;
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }
    .badge {
      font-size: 10.5px;
      font-weight: 800;
      padding: 5px 11px;
      border-radius: 999px;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      background: rgba(9, 8, 18, 0.92);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #fff;
    }
    /* ХИТ — неоновый розово-коралловый акцент */
    .badge.hit {
      background: rgba(244, 63, 94, 0.2);
      border-color: #fb7185;
      color: #ffe4e6;
      box-shadow: 0 0 14px rgba(244, 63, 94, 0.45), inset 0 0 6px rgba(244, 63, 94, 0.25);
    }
    /* НОВИНКА — неоновый фиолетовый акцент */
    .badge.new {
      background: rgba(168, 85, 247, 0.22);
      border-color: #c084fc;
      color: #f3e8ff;
      box-shadow: 0 0 14px rgba(168, 85, 247, 0.45), inset 0 0 6px rgba(168, 85, 247, 0.25);
    }
    /* Статус — неоновый циановый акцент */
    .badge.cyan {
      background: rgba(6, 182, 212, 0.18);
      border-color: #22d3ee;
      color: #cffafe;
      box-shadow: 0 0 14px rgba(34, 211, 238, 0.35), inset 0 0 6px rgba(34, 211, 238, 0.2);
    }

    .card-content {
      position: relative;
      padding: 14px 16px 16px;
    }
    .card-header-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 6px;
    }
    .card-title {
      font-family: 'Unbounded', sans-serif;
      font-size: 18px;
      font-weight: 700;
      color: #fff;
      text-shadow: 0 0 16px rgba(168, 85, 247, 0.25);
    }
    .arrow-icon {
      width: 22px;
      height: 22px;
      color: var(--cyan);
      filter: drop-shadow(0 0 6px rgba(34, 211, 238, 0.6));
      transition: transform 0.2s;
    }
    .product-card:hover .arrow-icon {
      transform: translateX(3px);
    }

    .card-text {
      color: var(--text-muted);
      font-size: 13px;
      line-height: 1.45;
      margin-bottom: 14px;
    }

    .card-footer-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-top: 12px;
      position: relative;
    }
    /* Тонкая неоновая линия-разделитель */
    .card-footer-row::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 1px;
      background: linear-gradient(90deg, rgba(168, 85, 247, 0.4), rgba(34, 211, 238, 0.4), transparent);
    }
    .price-from {
      font-size: 12px;
      color: var(--text-muted);
    }
    .price-value {
      font-size: 17px;
      font-weight: 800;
      color: #fff;
      margin-left: 4px;
      text-shadow: 0 0 12px rgba(255, 255, 255, 0.2);
    }
    .more-label {
      font-size: 13px;
      font-weight: 700;
      color: var(--cyan);
      display: flex;
      align-items: center;
      gap: 4px;
      text-shadow: 0 0 10px rgba(34, 211, 238, 0.4);
    }

    /* Кнопки меню */
    .action-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 6px;
      margin-bottom: 20px;
    }
    .sub-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 14px 12px;
      border: 1px solid transparent;
      background: 
        linear-gradient(180deg, rgba(22, 18, 40, 0.9), rgba(15, 13, 28, 0.95)) padding-box,
        linear-gradient(135deg, rgba(168, 85, 247, 0.45), rgba(34, 211, 238, 0.45)) border-box;
      border-radius: 16px;
      color: #fff;
      text-decoration: none;
      font-size: 13px;
      font-weight: 600;
      box-shadow: var(--soft-shadow);
      transition: transform 0.15s, box-shadow 0.15s;
    }
    .sub-btn:active {
      transform: scale(0.96);
    }

    /* Соцсети в подвале */
    .social-links {
      display: flex;
      justify-content: center;
      gap: 14px;
      margin-top: 10px;
    }
    .social-btn {
      width: 46px;
      height: 46px;
      border-radius: 50%;
      border: 1px solid transparent;
      background: 
        linear-gradient(180deg, #161228, #0f0d1c) padding-box,
        linear-gradient(135deg, rgba(168, 85, 247, 0.5), rgba(34, 211, 238, 0.5)) border-box;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      text-decoration: none;
      box-shadow: var(--soft-shadow);
      transition: transform 0.15s;
    }
    .social-btn:active {
      transform: scale(0.92);
    }

    /* Экраны деталей продукта */
    .top-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }
    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 9px 16px;
      border-radius: 999px;
      background: rgba(19, 16, 36, 0.94);
      border: 1px solid rgba(168, 85, 247, 0.45);
      color: #fff;
      text-decoration: none;
      font-size: 13px;
      font-weight: 600;
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.4), 0 0 12px rgba(168, 85, 247, 0.2);
      transition: transform 0.15s;
    }
    .back-btn:active {
      transform: scale(0.94);
    }

    .detail-title {
      font-family: 'Unbounded', sans-serif;
      font-size: 23px;
      font-weight: 800;
      margin-bottom: 14px;
      line-height: 1.25;
      text-shadow: 0 0 18px rgba(168, 85, 247, 0.3);
    }

    /* Видеоплеер */
    .video-viewport {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      background-color: #0f0d1b;
      border-radius: 18px;
      overflow: hidden;
      border: 1.5px solid rgba(34, 211, 238, 0.4);
      margin-bottom: 22px;
      box-shadow: var(--card-shadow);
      background-size: cover;
      background-position: center;
      cursor: pointer;
    }
    .play-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      gap: 8px;
      align-items: center;
      justify-content: center;
      background: linear-gradient(180deg, rgba(7,7,13,0.2) 0%, rgba(7,7,13,0.65) 100%);
      transition: background 0.2s;
    }
    .play-btn-circle {
      width: 62px;
      height: 62px;
      border-radius: 50%;
      background: rgba(15, 12, 28, 0.65);
      border: 1.5px solid var(--cyan);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 24px rgba(34, 211, 238, 0.55), inset 0 0 12px rgba(34, 211, 238, 0.25);
      transition: transform 0.2s;
    }
    .play-caption {
      font-size: 12px;
      font-weight: 600;
      color: rgba(255, 255, 255, 0.92);
      background: rgba(9, 8, 18, 0.75);
      border: 1px solid rgba(255, 255, 255, 0.12);
      padding: 4px 12px;
      border-radius: 999px;
    }
    .video-viewport:active .play-btn-circle {
      transform: scale(0.92);
    }
    .video-viewport iframe,
    .video-viewport video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }

    /* Список преимуществ */
    .section-headline {
      font-family: 'Unbounded', sans-serif;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.5px;
      margin-bottom: 12px;
      color: #e2e8f0;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .features-list {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 24px;
    }
    .feature-item {
      border: 1px solid transparent;
      background: 
        linear-gradient(180deg, rgba(20, 16, 38, 0.88), rgba(14, 12, 26, 0.92)) padding-box,
        linear-gradient(135deg, rgba(168, 85, 247, 0.35), rgba(34, 211, 238, 0.25)) border-box;
      border-radius: 16px;
      padding: 13px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      box-shadow: var(--soft-shadow);
    }
    .feature-icon-box {
      width: 34px;
      height: 34px;
      border-radius: 10px;
      background: rgba(34, 211, 238, 0.12);
      border: 1px solid rgba(34, 211, 238, 0.45);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--cyan);
      box-shadow: 0 0 14px rgba(34, 211, 238, 0.25);
    }
    .feature-title {
      font-size: 12.5px;
      font-weight: 600;
      color: #cbd5e1;
      line-height: 1.35;
    }

    /* Тарифная сетка */
    .plans-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 12px;
      margin-bottom: 24px;
    }
    .plan-box {
      position: relative;
      border: 1px solid transparent;
      background: 
        linear-gradient(180deg, rgba(20, 16, 38, 0.9), rgba(14, 12, 26, 0.95)) padding-box,
        linear-gradient(135deg, rgba(168, 85, 247, 0.4), rgba(34, 211, 238, 0.3)) border-box;
      border-radius: 18px;
      padding: 16px 12px;
      text-align: center;
      display: flex;
      flex-direction: column;
      justify-content: center;
      box-shadow: var(--soft-shadow);
    }
    .plan-box.featured {
      border: 1.5px solid transparent;
      background: 
        linear-gradient(180deg, rgba(16, 28, 46, 0.92), rgba(17, 14, 32, 0.96)) padding-box,
        linear-gradient(135deg, #22d3ee, #a855f7) border-box;
      box-shadow: 0 12px 28px -6px rgba(0, 0, 0, 0.7), 0 0 22px rgba(34, 211, 238, 0.22);
    }
    .plan-discount-badge {
      position: absolute;
      top: -10px;
      right: 10px;
      background: linear-gradient(135deg, #ec4899, #f43f5e);
      color: #fff;
      font-size: 10px;
      font-weight: 800;
      padding: 3px 9px;
      border-radius: 999px;
      box-shadow: 0 0 14px rgba(244, 63, 94, 0.6);
    }
    .plan-name {
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      color: var(--text-muted);
      letter-spacing: 0.5px;
      margin-bottom: 6px;
    }
    .plan-old-price {
      font-size: 13px;
      color: #fb7185;
      text-decoration: line-through;
    }
    .plan-current-price {
      font-size: 20px;
      font-weight: 800;
      color: #fff;
      font-family: 'Unbounded', sans-serif;
      margin-top: 2px;
      text-shadow: 0 0 14px rgba(34, 211, 238, 0.25);
    }

    /* Главная кнопка заказа (CTA) */
    .cta-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      padding: 17px;
      border-radius: 18px;
      background: var(--btn-grad);
      color: #ffffff;
      font-size: 16px;
      font-weight: 800;
      text-decoration: none;
      box-shadow: 0 10px 28px rgba(6, 182, 212, 0.42), 0 0 18px rgba(168, 85, 247, 0.3), inset 0 1px 0 rgba(255, 255, 255, 0.35);
      transition: transform 0.15s, box-shadow 0.15s;
    }
    .cta-btn:active {
      transform: scale(0.97);
      box-shadow: 0 4px 14px rgba(6, 182, 212, 0.3);
    }

    /* Текстовые инфо-экраны */
    .info-card {
      border: 1px solid transparent;
      background: 
        linear-gradient(180deg, rgba(20, 16, 38, 0.9), rgba(14, 12, 26, 0.95)) padding-box,
        linear-gradient(135deg, rgba(168, 85, 247, 0.4), rgba(34, 211, 238, 0.35)) border-box;
      border-radius: var(--radius);
      padding: 20px;
      margin-bottom: 18px;
      line-height: 1.6;
      font-size: 14px;
      color: #cbd5e1;
      box-shadow: var(--soft-shadow);
    }
    .step-item {
      display: flex;
      gap: 12px;
      margin-bottom: 14px;
    }
    .step-item:last-child {
      margin-bottom: 0;
    }
    .step-num {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background: rgba(6, 182, 212, 0.15);
      color: var(--cyan);
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      flex-shrink: 0;
      box-shadow: 0 2px 8px rgba(6, 182, 212, 0.2);
    }
  
    /* Живой логотип: волны «дышат», ореол пульсирует, лого слегка парит. Только transform/opacity — плавно на 120 Гц */
    .live-logo{position:relative;width:min(300px,82vw);aspect-ratio:1250/718;animation:llFloat 6s ease-in-out infinite;will-change:transform}
    .live-logo::before{content:"";position:absolute;inset:-14% -10%;z-index:-1;background:radial-gradient(closest-side,rgba(168,85,247,.5),rgba(236,72,153,.22) 60%,transparent);animation:llHalo 4.5s ease-in-out infinite;will-change:opacity,transform}
    .ll{position:absolute;inset:0;width:100%;height:100%;user-select:none;-webkit-user-drag:none}
    .ll.base{clip-path:polygon(33% 0,67% 0,67% 58%,100% 58%,100% 100%,0 100%,0 58%,33% 58%)}
    .ll.wl{clip-path:inset(0 67% 42% 0);transform-origin:17% 29%;animation:llEq 2.8s ease-in-out infinite;will-change:transform}
    .ll.wr{clip-path:inset(0 0 42% 67%);transform-origin:83% 29%;animation:llEq 2.8s ease-in-out -1.4s infinite;will-change:transform}
    @keyframes llEq{0%,100%{transform:scaleY(.92)}50%{transform:scaleY(1.08)}}
    @keyframes llHalo{0%,100%{opacity:.55;transform:scale(.96)}50%{opacity:1;transform:scale(1.06)}}
    @keyframes llFloat{0%,100%{transform:translate3d(0,0,0)}50%{transform:translate3d(0,-5px,0)}}
    @media (prefers-reduced-motion:reduce){.live-logo,.live-logo::before,.ll{animation:none!important}}
  
    /* ===== Адаптивность: телефон → планшет → ноутбук → большой монитор ===== */
    .narrow{max-width:640px;margin:0 auto}
    @media (max-width:359px){
      .container{padding-left:12px;padding-right:12px}
      .card-title{font-size:16px}.detail-title{font-size:20px}
      .features-list{grid-template-columns:1fr}
    }
    @media (min-width:600px){
      .container{max-width:760px;padding-left:24px;padding-right:24px}
      main{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));column-gap:20px;align-items:stretch}
      main .action-grid,main .social-links{grid-column:1/-1}
      .action-grid{max-width:520px;width:100%;margin-left:auto;margin-right:auto}
      .brand-desc{max-width:480px;font-size:15px}
      .live-logo{width:min(360px,60vw)}
      .features-list{grid-template-columns:repeat(4,1fr)}
      .detail-title{font-size:28px}
    }
    @media (min-width:900px){
      .container{max-width:1120px;padding-top:max(32px,env(safe-area-inset-top))}
      main{grid-template-columns:repeat(auto-fit,minmax(320px,500px));justify-content:center;column-gap:28px}
      .live-logo{width:400px}
      .brand-desc{max-width:560px;font-size:16px}
      .header{margin-bottom:34px}
      .product-card:hover{transform:translateY(-4px)}
      .product-card{display:flex;flex-direction:column}.product-card .card-content{flex:1;display:flex;flex-direction:column}.product-card .card-footer-row{margin-top:auto}
      .product-view{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);column-gap:36px;align-items:start}
      .product-view>.top-nav,.product-view>.detail-title{grid-column:1/-1}
      .product-view>.video-viewport{grid-column:1;grid-row:3/span 5;position:sticky;top:24px}
      .product-view>:not(.top-nav):not(.detail-title):not(.video-viewport){grid-column:2}
      .product-view .features-list{grid-template-columns:1fr 1fr}
      .detail-title{font-size:34px}
      .narrow{max-width:720px}
    }
    @media (min-width:1500px){.container{max-width:1240px}.card-banner{height:200px}}
    @media (max-height:480px) and (orientation:landscape){.live-logo{width:200px}.header{margin-bottom:12px}}

    /* ===== Главная помещается в один экран; подсветка логотипа мягче ===== */
    .live-logo{width:clamp(130px,25dvh,380px)}

    @keyframes llHalo{0%,100%{opacity:.35;transform:scale(.96)}50%{opacity:.7;transform:scale(1.04)}}

    .container{padding-top:max(clamp(8px,2dvh,24px),env(safe-area-inset-top));padding-bottom:max(clamp(12px,2.5dvh,32px),env(safe-area-inset-bottom))}
    .header{margin-bottom:clamp(6px,1.6dvh,26px)}
    .brand-logo-wrap{min-height:0;margin-bottom:clamp(2px,.8dvh,10px)}
    .brand-desc{font-size:clamp(12px,1.7dvh,15px)}
    .card-banner{height:clamp(60px,11dvh,170px)}
    .product-card{margin-bottom:clamp(8px,1.6dvh,18px)}
    .card-content{padding:clamp(8px,1.3dvh,14px) 14px clamp(8px,1.3dvh,16px)}
    .card-text{font-size:12.5px;margin-bottom:clamp(6px,1.2dvh,14px);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
    .card-footer-row{padding-top:clamp(6px,1dvh,12px)}
    .action-grid{margin-bottom:clamp(8px,1.6dvh,20px)}
    .sub-btn{padding:clamp(9px,1.5dvh,14px) 12px}
    @media (max-height:700px){.brand-desc,.card-text{display:none}}

    /* ===== Внутренние страницы без скролла ===== */
    .top-nav{margin-bottom:clamp(6px,1.4dvh,16px)}
    .back-btn{padding:clamp(6px,1dvh,9px) 14px}
    .detail-title{font-size:clamp(18px,3.2dvh,28px);margin-bottom:clamp(6px,1.4dvh,14px)}
    .video-viewport{aspect-ratio:auto;height:clamp(90px,21dvh,300px);margin-bottom:clamp(8px,1.8dvh,22px)}
    .section-headline{margin:0 0 clamp(5px,1dvh,10px);font-size:clamp(13px,2dvh,16px)}
    .features-list{gap:clamp(6px,1dvh,10px);margin-bottom:clamp(8px,1.8dvh,24px)}
    .feature-item{flex-direction:row;align-items:center;padding:clamp(7px,1.2dvh,13px);gap:8px}
    .feature-title{font-size:12px;line-height:1.25}
    .feature-icon-box{flex:none;width:clamp(26px,4dvh,34px);height:clamp(26px,4dvh,34px)}
    .plans-grid{margin-bottom:clamp(8px,1.8dvh,24px);gap:clamp(6px,1dvh,12px)}
    .plan-box{padding:clamp(8px,1.4dvh,16px) 8px}
    .cta-btn{padding:clamp(11px,1.8dvh,17px)}
    .step-item{padding-top:clamp(6px,1.4dvh,14px);padding-bottom:clamp(6px,1.4dvh,14px)}
    @media (max-height:700px){.play-caption{display:none}}
    @media (min-width:900px){.product-view .video-viewport{height:auto;aspect-ratio:16/9;max-height:62dvh}}

    /* ===== Эквалайзер на фоне внизу экрана ===== */
    .eq-bg{position:fixed;left:0;right:0;bottom:0;height:clamp(70px,17dvh,180px);z-index:0;pointer-events:none;display:flex;align-items:flex-end;gap:3px;padding:0 4px;opacity:.6}
    .eq-bg i{flex:1;height:100%;min-width:2px;border-radius:4px 4px 0 0;transform-origin:50% 100%;transform:scaleY(var(--lo));
      background:linear-gradient(to top,hsla(var(--h),90%,62%,.9),hsla(var(--h),90%,62%,.12));
      animation:eqBar var(--d) ease-in-out var(--dl) infinite alternate}
    @keyframes eqBar{from{transform:scaleY(var(--lo))}to{transform:scaleY(var(--hi))}}
    @media (prefers-reduced-motion:reduce){.eq-bg i{animation:none;transform:scaleY(.3)}}

    /* ===== Mini App ===== */
    .in-tg .back-btn{display:none}
    .in-tg .plan-box[data-i]{cursor:pointer;transition:transform .15s,border-color .2s}
    .in-tg .plan-box[data-i]:active{transform:scale(.97)}
    .plan-box.selected{border-color:var(--cyan)!important;box-shadow:0 0 0 1px var(--cyan),0 0 18px rgba(34,211,238,.35)}
    .order-box{margin:0 0 12px}
    .fld-label{display:block;font-size:13px;color:#a8a8c0;margin-bottom:6px}
    .order-box input,.order-box textarea{width:100%;padding:13px 14px;border-radius:14px;border:1.5px solid rgba(168,85,247,.45);background:rgba(15,13,28,.9);color:#fff;font:600 16px/1.3 system-ui,sans-serif;letter-spacing:.5px;outline:none}
    .order-box input:focus,.order-box textarea:focus{border-color:var(--cyan);box-shadow:0 0 14px rgba(34,211,238,.3)}
    .fld-hint{margin-top:6px;font-size:12px;color:#8d8da8}.fld-hint.bad{color:#ff7a90}
    .cta-btn:disabled{opacity:.45;filter:saturate(.6);pointer-events:none}

      sliders: `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="21" x2="4" y2="14"></line><line x1="4" y1="10" x2="4" y2="3"></line><line x1="12" y1="21" x2="12" y2="12"></line><line x1="12" y1="8" x2="12" y2="3"></line><line x1="20" y1="21" x2="20" y2="16"></line><line x1="20" y1="12" x2="20" y2="3"></line><line x1="1" y1="14" x2="7" y2="14"></line><line x1="9" y1="8" x2="15" y2="8"></line><line x1="17" y1="16" x2="23" y2="16"></line></svg>`,
      mic: `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#f472b6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"></path><path d="M19 10v2a7 7 0 0 1-14 0v-2"></path><line x1="12" y1="19" x2="12" y2="22"></line></svg>`,
      gamepad: `<svg width="27" height="27" viewBox="0 0 24 24" fill="none" stroke="#c084fc" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><g transform="rotate(-12 8.5 15.5)"><rect x="2.5" y="9.5" width="12" height="12" rx="2.6"/><circle cx="6" cy="13" r="1.3" fill="#c084fc" stroke="none"/><circle cx="11" cy="13" r="1.3" fill="#c084fc" stroke="none"/><circle cx="8.5" cy="15.5" r="1.3" fill="#c084fc" stroke="none"/><circle cx="6" cy="18" r="1.3" fill="#c084fc" stroke="none"/><circle cx="11" cy="18" r="1.3" fill="#c084fc" stroke="none"/></g><g transform="rotate(14 16.5 7.5)"><rect x="11.5" y="2.5" width="10" height="10" rx="2.3"/><circle cx="14.5" cy="5.5" r="1.2" fill="#c084fc" stroke="none"/><circle cx="16.5" cy="7.5" r="1.2" fill="#c084fc" stroke="none"/><circle cx="18.5" cy="9.5" r="1.2" fill="#c084fc" stroke="none"/></g></svg>`,
      tgLogo: `<svg width="30" height="30" viewBox="0 0 24 24"><defs><linearGradient id="tgG" x1="12" y1="0" x2="12" y2="24" gradientUnits="userSpaceOnUse"><stop stop-color="#37aee2"/><stop offset="1" stop-color="#1e96c8"/></linearGradient></defs><circle cx="12" cy="12" r="12" fill="url(#tgG)"/><path fill="#fff" d="M16.906 7.224c.1-.002.321.023.465.14a.506.506 0 0 1 .171.325c.016.093.036.306.02.472-.18 1.898-.962 6.502-1.36 8.627-.168.9-.499 1.201-.82 1.23-.696.065-1.225-.46-1.9-.902-1.056-.693-1.653-1.124-2.678-1.8-1.185-.78-.417-1.21.258-1.91.177-.184 3.247-2.977 3.307-3.23.007-.032.014-.15-.056-.212s-.174-.041-.249-.024c-.106.024-1.793 1.14-5.061 3.345-.48.33-.913.49-1.302.48-.428-.008-1.252-.241-1.865-.44-.752-.245-1.349-.374-1.297-.789.027-.216.325-.437.893-.663 3.498-1.524 5.83-2.529 6.998-3.014 3.332-1.386 4.025-1.627 4.476-1.635z"/></svg>`,
      tgLogoWhite: `<svg width="24" height="24" viewBox="0 0 24 24"><circle cx="12" cy="12" r="12" fill="#fff"/><path fill="#229ED9" d="M16.906 7.224c.1-.002.321.023.465.14a.506.506 0 0 1 .171.325c.016.093.036.306.02.472-.18 1.898-.962 6.502-1.36 8.627-.168.9-.499 1.201-.82 1.23-.696.065-1.225-.46-1.9-.902-1.056-.693-1.653-1.124-2.678-1.8-1.185-.78-.417-1.21.258-1.91.177-.184 3.247-2.977 3.307-3.23.007-.032.014-.15-.056-.212s-.174-.041-.249-.024c-.106.024-1.793 1.14-5.061 3.345-.48.33-.913.49-1.302.48-.428-.008-1.252-.241-1.865-.44-.752-.245-1.349-.374-1.297-.789.027-.216.325-.437.893-.663 3.498-1.524 5.83-2.529 6.998-3.014 3.332-1.386 4.025-1.627 4.476-1.635z"/></svg>`,
      arrowRight: `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>`
    };

    const root = document.getElementById('root');
    const fmtMoney = n => Number(n).toLocaleString('ru-RU') + ' ₽';
    /* Ссылка на бота: ?start=<id продукта> открывает карточку этого продукта в боте */
    const makeTgUrl = payload => `https://t.me/${SITE.telegramUsername}` + (payload ? `?start=${encodeURIComponent(payload)}` : '');

    /* ===== Режим Telegram Mini App ===== */
    const TG = window.Telegram && window.Telegram.WebApp;
    const IN_APP = !!(TG && (TG.initData || (TG.platform && TG.platform !== 'unknown')));
    // sendData работает только если приложение открыто кнопкой клавиатуры (тогда нет query_id)
    const CAN_SEND = IN_APP && !(TG.initDataUnsafe && TG.initDataUnsafe.query_id);
    const order = { pid: '', idx: 0, hw: '', note: '' };
    const normHw = v => String(v || '').replace(/\s+/g, '').toUpperCase();
    const curProduct = () => SITE.products.find(p => p.id === order.pid);
    const buzz = k => { try { TG.HapticFeedback.impactOccurred(k || 'light'); } catch (e) {} };

    function orderFields(p, i) {
      return p.plans[i].delivery === 'manual'
        ? `<label class="fld-label" for="note">Контакт для связи и пожелания</label>
           <textarea id="note" rows="2" maxlength="300" placeholder="Телефон или @ник, адрес и пожелания"></textarea>`
        : `<label class="fld-label" for="hw">Код устройства</label>
           <input id="hw" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="ABCD-1234-EFGH">
           <div class="fld-hint" id="hwHint">${p.hwidHelp || ''}</div>`;
    }
    function orderForm(p) {
      order.pid = p.id; order.idx = 0; order.hw = ''; order.note = '';
      setTimeout(refreshPay, 0);
      return `<div class="order-box" id="orderBox">${orderFields(p, 0)}</div>
        <button class="cta-btn" id="payBtn" type="button" disabled><span id="payLabel">Оплатить</span></button>`;
    }
    function refreshPay() {
      const p = curProduct(); if (!p) return;
      const pl = p.plans[order.idx]; let ok, bad = '';
      if (pl.delivery === 'manual') ok = order.note.trim().length >= 3;
      else {
        ok = new RegExp(p.hwidRegex || '^[A-Z0-9-]{8,64}$').test(normHw(order.hw));
        if (order.hw && !ok) bad = 'Похоже на ошибку: 8–64 символа, латиница, цифры и дефис';
      }
      const btn = document.getElementById('payBtn'), hint = document.getElementById('hwHint'), lab = document.getElementById('payLabel');
      if (btn) btn.disabled = !ok;
      if (lab) lab.textContent = 'Оплатить ' + fmtMoney(pl.price);
      if (hint) { hint.textContent = bad || p.hwidHelp || ''; hint.classList.toggle('bad', !!bad); }
    }
    function submitOrder() {
      const p = curProduct(); if (!p) return;
      const pl = p.plans[order.idx], payload = { v: 1, p: p.id, i: order.idx };
      if (pl.delivery === 'manual') payload.n = order.note.trim(); else payload.h = normHw(order.hw);
      buzz('medium');
      if (CAN_SEND) TG.sendData(JSON.stringify(payload));   // бот получит заказ и пришлёт ссылку на оплату
      else TG.openTelegramLink(makeTgUrl(p.id));            // запасной путь: открыто не с кнопки клавиатуры
    }
    if (IN_APP) {
      document.documentElement.classList.add('in-tg');
      try { TG.ready(); TG.expand(); TG.setHeaderColor('#07070d'); TG.setBackgroundColor('#07070d'); TG.disableVerticalSwipes && TG.disableVerticalSwipes(); } catch (e) {}
      const syncBack = () => { const home = !location.hash || location.hash === '#/'; try { home ? TG.BackButton.hide() : TG.BackButton.show(); } catch (e) {} };
      try { TG.BackButton.onClick(() => { location.hash = '#/'; }); } catch (e) {}
      window.addEventListener('hashchange', syncBack); syncBack();
      document.addEventListener('click', e => {
        const box = e.target.closest('.plan-box[data-i]');
        if (box && document.getElementById('orderBox')) {
          order.idx = +box.dataset.i; order.hw = ''; order.note = '';
          document.querySelectorAll('.plan-box').forEach(b => b.classList.toggle('selected', b === box));
          document.getElementById('orderBox').innerHTML = orderFields(curProduct(), order.idx);
          refreshPay(); buzz('light');
        }
        if (e.target.closest('#payBtn')) submitOrder();
      });
      document.addEventListener('input', e => {
        if (e.target.id === 'hw') order.hw = e.target.value;
        if (e.target.id === 'note') order.note = e.target.value;
        refreshPay();
      });
    }


    /* Генератор шапки без плашки «Локальные решения» */
    function renderHeader() {
      return `
        <header class="header">
          <div class="brand-logo-wrap" id="logoBox">
            <div class="live-logo">
              <img class="ll base" src="${SITE.logoPrimary}" alt="${SITE.brand}" onerror="handleLogoError(this)">
              <img class="ll wl" src="${SITE.logoPrimary}" alt="" aria-hidden="true">
              <img class="ll wr" src="${SITE.logoPrimary}" alt="" aria-hidden="true">
            </div>
          </div>
          <p class="brand-desc">${SITE.tagline}</p>
        </header>
      `;
    }

    /* Фолбек при отсутствии файла логотипа */
    window.handleLogoError = function(img) {
      if (img.dataset.triedSecondary !== 'true') {
        img.dataset.triedSecondary = 'true';
        img.src = SITE.logoSecondary;
      } else {
        const logoBox = document.getElementById('logoBox');
        if (logoBox) {
          logoBox.innerHTML = `
            <div class="brand-logo-fallback">
              <div class="ps-mark">PS</div>
              <div class="ps-title">PAVEL SISTEM</div>
              <div class="ps-sub">DIGITAL</div>
            </div>
          `;
        }
      }
    };

    /* Главная страница */
    function renderHome() {
      return `
        <div class="view-screen">
          ${renderHeader()}

          <main>
            ${SITE.products.map(p => {
              const minPrice = Math.min(...p.plans.map(x => x.price));
              return `
                <a class="product-card" href="#/${p.id}">
                  <div class="card-banner" style="background-image: url('${p.cover}');">
                    <div class="card-badges">
                      ${p.badges.map(b => `<span class="badge ${b.type}">${b.text}</span>`).join('')}
                    </div>
                    <div class="banner-visual-badge">
                      ${ICONS[p.icon] || ICONS.gamepad}
                    </div>
                  </div>
                  <div class="card-content">
                    <div class="card-header-row">
                      <h2 class="card-title">${p.title}</h2>
                      <span class="arrow-icon">${ICONS.arrowRight}</span>
                    </div>
                    <p class="card-text">${p.short}</p>
                    <div class="card-footer-row">
                      <div class="price-from">от <strong class="price-value">${fmtMoney(minPrice)}</strong></div>
                      <div class="more-label">Подробнее ${ICONS.arrowRight}</div>
                    </div>
                  </div>
                </a>
              `;
            }).join('')}

            <div class="action-grid">
              <a class="sub-btn" href="#/contacts">
                <span>💬</span> Связаться
              </a>
              <a class="sub-btn" href="#/how">
                <span>⚙</span> Как это работает
              </a>
            </div>

            <div class="social-links">
              <a class="social-btn" href="${SITE.telegramUrl}" target="_blank" rel="noopener" title="Telegram">
                ${ICONS.tgLogo}
              </a>
              <a class="social-btn" href="${SITE.vkUrl}" target="_blank" rel="noopener" title="VK" style="font-weight:700; font-size:14px;">
                VK
              </a>
            </div>
          </main>
        </div>
      `;
    }

    /* Экран конкретного продукта */
    function renderProduct(p) {
      return `
        <div class="view-screen product-view">
          <div class="top-nav">
            <a class="back-btn" href="#/">
              ← Назад
            </a>
            <div class="card-badges">
              ${p.badges.map(b => `<span class="badge ${b.type}">${b.text}</span>`).join('')}
            </div>
          </div>

          <h1 class="detail-title">${p.title}</h1>

          <div class="video-viewport" data-video="${p.video}" style="background-image: url('${p.cover}');">
            <div class="play-overlay">
              <div class="play-btn-circle">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="#ffffff" style="margin-left:3px;"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
              </div>
              <span class="play-caption">Смотреть видеообзор</span>
            </div>
          </div>

          <div class="section-headline">Преимущества</div>
          <div class="features-list">
            ${p.features.map(f => `
              <div class="feature-item">
                <div class="feature-icon-box">
                  ${ICONS[f.icon] || ICONS.wifi}
                </div>
                <div class="feature-title">${f.text}</div>
              </div>
            `).join('')}
          </div>

          <div class="section-headline">Тарифы</div>
          <div class="plans-grid">
            ${p.plans.map((plan, i) => `
              <div class="plan-box ${plan.oldPrice ? 'featured' : ''} ${IN_APP && i === 0 ? 'selected' : ''}" data-i="${i}">
                ${plan.oldPrice ? `<span class="plan-discount-badge">−${Math.round((1 - plan.price / plan.oldPrice) * 100)}%</span>` : ''}
                <div class="plan-name">${plan.name}</div>
                ${plan.oldPrice ? `<div class="plan-old-price">${fmtMoney(plan.oldPrice)}</div>` : ''}
                <div class="plan-current-price">${fmtMoney(plan.price)}</div>
              </div>
            `).join('')}
          </div>

          ${IN_APP ? orderForm(p) : `<a class="cta-btn" target="_blank" rel="noopener" href="${makeTgUrl(p.id)}">
            <span>Заказать в Telegram</span>
            ${ICONS.tgLogoWhite}
          </a>`}
        </div>
      `;
    }

    /* Экран "Как это работает" */
    function renderHow() {
      return `
        <div class="view-screen narrow">
          <div class="top-nav">
            <a class="back-btn" href="#/">← Назад</a>
          </div>
          <h1 class="detail-title">Как это работает</h1>
          <div class="info-card">
            ${SITE.howItWorks.map((step, idx) => `
              <div class="step-item">
                <div class="step-num">${idx + 1}</div>
                <div>${step}</div>
              </div>
            `).join('')}
          </div>
          <a class="cta-btn" target="_blank" rel="noopener" href="${makeTgUrl('')}">
            <span>Задать вопрос в Telegram</span>
            ${ICONS.tgLogoWhite}
          </a>
        </div>
      `;
    }

    /* Экран контактов */
    function renderContacts() {
      return `
        <div class="view-screen narrow">
          <div class="top-nav">
            <a class="back-btn" href="#/">← Назад</a>
          </div>
          <h1 class="detail-title">Контакты</h1>
          <div class="info-card">
            <p style="margin-bottom:12px;">По всем вопросам приобретения, сотрудничества или демонстрации софта пишите напрямую в Telegram или соцсети.</p>
            <p><strong>График:</strong> На связи ежедневно</p>
          </div>
          <a class="cta-btn" style="margin-bottom:12px;" target="_blank" rel="noopener" href="${makeTgUrl('')}">
            <span>Написать в Telegram</span>
            ${ICONS.tgLogoWhite}
          </a>
          <a class="sub-btn" style="width:100%;" target="_blank" rel="noopener" href="${SITE.vkUrl}">
            Сообщество ВКонтакте
          </a>
        </div>
      `;
    }

    /* Роутер со слайдер-переходами */
    let currentRoute = null;

    function getScreenHtml(hash) {
      const product = SITE.products.find(p => p.id === hash);
      if (product) return renderProduct(product);
      if (hash === 'how') return renderHow();
      if (hash === 'contacts') return renderContacts();
      return renderHome();
    }

    function router() {
      const hash = window.location.hash.replace('#/', '').replace('#', '');
      const nextHtml = getScreenHtml(hash);

      // Первый рендер без анимации слайда
      if (currentRoute === null) {
        root.innerHTML = nextHtml;
        currentRoute = hash;
        return;
      }

      if (currentRoute === hash) return;

      // Определяем направление слайдера: вперёд (вглубь) или назад (на главную)
      const isGoingBack = (hash === '' && currentRoute !== '');
      const screens = root.querySelectorAll('.view-screen');
      screens.forEach((el, i) => { if (i < screens.length - 1) el.remove(); });
      const oldScreen = root.querySelector('.view-screen');

      const tempWrap = document.createElement('div');
      tempWrap.innerHTML = nextHtml.trim();
      const newScreen = tempWrap.firstElementChild;

      if (oldScreen && newScreen) {
        const r0 = oldScreen.getBoundingClientRect();
        oldScreen.style.cssText = `position:fixed;top:${r0.top}px;left:${r0.left}px;width:${r0.width}px;right:auto;`;
        oldScreen.classList.remove('slide-next-enter', 'slide-prev-enter');
        oldScreen.classList.add(isGoingBack ? 'slide-prev-leave' : 'slide-next-leave');
        newScreen.classList.add(isGoingBack ? 'slide-prev-enter' : 'slide-next-enter');

        root.appendChild(newScreen);
        window.scrollTo({ top: 0, left: 0, behavior: 'instant' });

        setTimeout(() => {
          if (oldScreen.parentNode === root) {
            oldScreen.remove();
          }
          newScreen.classList.remove('slide-next-enter', 'slide-prev-enter');
        }, 370);
      } else {
        root.innerHTML = nextHtml;
        window.scrollTo(0, 0);
      }

      currentRoute = hash;
    }

    /* Воспроизведение видео при клике на превью */
    document.addEventListener('click', (e) => {
      const viewport = e.target.closest('.video-viewport');
      if (!viewport) return;

      const url = viewport.dataset.video;
      if (!url || viewport.querySelector('iframe, video')) return;

      if (url.endsWith('.mp4') || url.includes('.mp4?')) {
        viewport.innerHTML = `<video src="${url}" autoplay controls playsinline style="width:100%;height:100%;object-fit:cover;"></video>`;
      } else {
        const embedUrl = url.includes('?') ? url + '&autoplay=1' : url + '?autoplay=1';
        viewport.innerHTML = `<iframe src="${embedUrl}" allow="autoplay; fullscreen; encrypted-media" allowfullscreen></iframe>`;
      }
    });


    /* Эквалайзер: количество столбиков зависит от ширины экрана */
    (function () {
      const eq = document.getElementById('eqBg');
      let last = 0;
      function build() {
        const n = Math.max(24, Math.min(150, Math.round(innerWidth / 10)));
        if (n === last) return;
        last = n;
        let h = '';
        for (let i = 0; i < n; i++) {
          const x = i / (n - 1);
          const env = 0.45 + 0.55 * Math.sin(Math.PI * Math.min(1, x * 0.9 + 0.05)) ** 0.6; // выше к середине
          const hue = 190 + 130 * x;                      // циан → фиолетовый → розовый
          const hi = (env * (0.55 + Math.random() * 0.45)).toFixed(2);
          const lo = (0.06 + Math.random() * 0.14).toFixed(2);
          const d = (0.35 + Math.random() * 0.75).toFixed(2);
          const dl = (-Math.random() * 1.5).toFixed(2);
          h += `<i style="--h:${hue.toFixed(0)};--hi:${hi};--lo:${lo};--d:${d}s;--dl:${dl}s"></i>`;
        }
        eq.innerHTML = h;
      }
      build();
      let t; addEventListener('resize', () => { clearTimeout(t); t = setTimeout(build, 200); });
    })();

    /* Инициализация приложения */
    window.addEventListener('hashchange', router);
    if (document.readyState === 'loading') {
      window.addEventListener('DOMContentLoaded', router);
    } else {
      router();
    }
  </script>
</body>
</html>
